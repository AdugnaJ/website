<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact — Bolale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script>
document.getElementById('feedbackForm').addEventListener('submit', function(e) {
  e.preventDefault();
  const name = document.getElementById('name').value;
  const email = document.getElementById('email').value;
  const message = document.getElementById('message').value;
  const subject = encodeURIComponent(`Feedback from ${name}`);
  const body = encodeURIComponent(`${message}\n\nFrom: ${name} (${email})`);
  window.location.href = `mailto:jerry@bolaledesignlab.com?subject=${subject}&body=${body}`;
});
</script>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <div class="logo-slot">
      <div class="logo-img-box">
        <img src="IMG_0925.JPEG" alt="">
      </div>
      <div class="site-title">
        <a href="index.html">
          Bolale <span class="light">Design lab</span>
          <small>Addis Ababa · Ethiopia</small>
        </a>
      </div>
    </div>
    <nav class="main-nav" aria-label="Primary">
      <ul>
        <li><a href="index.html">Home</a></li>
        <!-- <li><a href="shop.html">Shop</a></li> -->
        <li><a href="lookbook.html">Lookbook</a></li>
        <li><a href="contact.html" aria-current="page">Contact</a></li>
      </ul>
    </nav>
  </div>
</header>

<main>

  <span class="section-label">Get in touch</span>
  <h2>Contacts</h2>

  
  <div class="info-card">
      <span class="section-label">Reach us</span>
      <p><span class="label">Phone</span> <a href="tel:+251939946013">+251 939 946 013</a></p>
      <p><span class="label">Email</span> <a href="mailto:jerry@bolaledesignlab.com">jerry@bolaledesignlab.com</a></p>
      <p><span class="label">Studio</span> Addis Ababa, Ethiopia</p>
    </div>
  <div class="one-col">

    
    <div>
      <span class="section-label">Find us</span>
      <div class="map-frame">
        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3940.782279393311!2d38.7786409760091!3d8.992171389562337!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x164b850050ba19ef%3A0xe7ed2d894e01880e!2sBolale%20Design%20lab!5e0!3m2!1sen!2set!4v1785318317300!5m2!1sen!2set" 
         allowfullscreen="" loading="lazy" 
        referrerpolicy="strict-origin-when-cross-origin">
      </iframe>
       
      </div>
      <p style="margin-top:14px;">Studio visits anytime.</p>
    </div>

  </div>


  <div class="socials-section" style="margin-top:40px;">
    <span class="section-label">Follow</span>
    <div class="socials-row">
      <a href="https://instagram.com/bolale_designlab" target="_blank" rel="noopener" class="social-link">
        <img
          src="https://upload.wikimedia.org/wikipedia/commons/a/a5/Instagram_icon.png"
          alt="Instagram"
          class="social-icon"
        >
        <span>@bolale_designlab</span>
      </a>
    </div>
  </div>
  <div class="socials-section" style="margin-top:80px;">
    <span class="section-label">Feedback</span>
      <form id="feedbackForm">
        <input type="text" id="name" placeholder="Name" required>
        <input type="email" id="email" placeholder="Email" required>
        <textarea id="message" placeholder="Message" required></textarea>
        <button type="submit">Submit</button>
      </form>
  </div>

</main>

<footer class="site-footer">
  <p>© Bolale </p>
</footer>

</body>
</html>
